<template>
    <!-- <lightning-card title="Silver"> -->
    <h1 class="slds-text-heading_large">Silver Countries list</h1>
    <lightning-input type="number" label="Enter Nav " class="units" onchange={displayDiscount}>


    </lightning-input>
    <!-- <input type="number" style={fetchStyleDynamically} label="Enter no of units" onchange={doUnitsValidation} >    </input> -->
    <div style={fetchStyleDynamically} >
        <lightning-input type="number" label="Enter no of units" onchange={doUnitsValidation}> </lightning-input>
    </div>
    <h4 class="slds-text-heading_small">Get 10% Instant Discount when buying more than 100 units </h4>
    <ul class="slds-has-dividers_around-space">
        <template for:each={silverExportCountries} for:item="country" for:index="index">
            <li class="slds-item" key={country}> {index}. {country} </li>
        </template>
    </ul>

    <lightning-button variant="success" label="Log All Countries" onclick={printCountryNames} title="Print CountryNames"
        class="slds-m-left_x-small"></lightning-button>
    <!-- </lightning-card > -->

    <!-- to modify a html ele at runtime, then ele must have a directive named lwc:dom -->
    <div class="slds-box" lwc:dom="manual"></div>
</template>
